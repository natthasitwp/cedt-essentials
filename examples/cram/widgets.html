<p class="kicker">Widgets</p><h1>ภาพโต้ตอบทั้งหมด</h1>
<p class="meta">ทุก widget ที่ใช้ได้ พร้อมค่าตัวอย่างของมัน ใช้ตรวจว่าทำงานก่อนใส่ในบทเรียน</p>
<h2>convolution</h2><div class="widget" data-widget="convolution" data-config="{&quot;x&quot;: &quot;rect(0,1)&quot;, &quot;h&quot;: &quot;rect(0,1)&quot;, &quot;range&quot;: [-2, 4], &quot;t&quot;: 0.5}"></div>
<h2>sentence-roles</h2><div class="widget" data-widget="sentence-roles" data-config="{&quot;sentence&quot;: &quot;The course that you took was hard.&quot;, &quot;clause&quot;: &quot;that you took&quot;, &quot;connector&quot;: &quot;that&quot;, &quot;role&quot;: &quot;object&quot;, &quot;reduced&quot;: &quot;The course you took was hard.&quot;}"></div>
